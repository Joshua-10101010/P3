<!DOCTYPE html>
<html>
<head>
</head>
<title>BookBridge - Digital Bookstore</title>
<body>
<h1>BookBridge</h1>
<h3>Digital Bookstore with Interactive Reading</h3>
<h2>1. Login Form</h2>
<form>
<label>Email:</label>
<input type="email" required>
<br><br>
<label>Password:</label>
<input type="password" required>
<br><br>
<input type="submit" value="Login">
<input type="reset" value="Clear">
</form>
<hr>
<h2>2. Sign Up Form</h2>
<form>
<label>First Name:</label>
<input type="text" required>
<br><br>
<label>Last Name:</label>
<input type="text" required>
<br><br>
<label>Email:</label>
<input type="email" required>
<br><br>
<label>Username:</label>
<input type="text" required>
<br><br>
<label>Password:</label>
<input type="password" required>
<br><br>
24
<label>Confirm Password:</label>
<input type="password" required>
<br><br>
<label>Date of Birth:</label>
<input type="date">
<br><br>
<label>Gender:</label>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
<br><br>
<input type="submit" value="Sign Up">
<input type="reset" value="Clear">
</form>
<hr>
<h2>3. BookBridge Reading Form</h2>
<form>
<label>First Name:</label>
<input type="text" required>
<br><br>
<label>Last Name:</label>
<input type="text" required>
<br><br>
<b>Reader Details</b>
<br><br>
<label>Email:</label>
<input type="email" required>
<br><br>
<label>Phone:</label>
<input type="tel" pattern="[6-9][0-9]{9}" maxlength="10" required>
<br><br>
<label>Book Name:</label>
<input type="text" required>
<br><br>
<label>Author:</label>
<input type="text">
<br><br>
<label>Genre:</label>
25
<select>
<option>Fiction</option>
<option>Science</option>
<option>History</option>
<option>Biography</option>
<option>Fantasy</option>
</select>
<br><br>
<label>Book Format:</label>
<input type="radio" name="format"> E-Book
<input type="radio" name="format"> Audiobook
<br><br>
<label>Reading Date:</label>
<input type="date">
<br><br>
<label>Reading Time:</label>
<input type="time">
<br><br>
<label>Interactive Features:</label>
<br>
<input type="checkbox"> Highlights
<input type="checkbox"> Notes
<input type="checkbox"> Bookmarks
<br><br>
<label>Special Requests:</label>
<br>
<textarea rows="4" cols="35"
placeholder="Enter your requests here"></textarea>
<br><br>
<input type="submit" value="Submit">
<input type="reset" value="Clear">
</form>
</body>
</html>
